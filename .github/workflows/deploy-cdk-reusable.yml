name: Deploy (AWS CDK - Reusable)

# One CDK deploy, driven by inputs. Callers pin a tag and pass their role, stage
# and region; the steps here are the same ones every consumer would otherwise
# hand-write, which is the point — a merge-to-main deploy and a labelled-PR
# deploy in the same repository cannot drift apart if both call this.
#
# Assumes a TypeScript CDK app built with npm, which is what every Answering CDK
# repository is. A Python or Go one needs its own workflow, not more inputs here.
#
# Deliberately NOT here: `concurrency`. The caller owns it. A group declared
# both in the caller and in this workflow deadlocks — the caller's run holds the
# group while the job it called queues for the same group, forever.

on:
  workflow_call:
    inputs:
      role_to_assume:
        description: >-
          IAM role ARN to assume via OIDC. Required, and with no default on
          purpose: this repository is public, and an account id committed here
          beside a description of what it deploys is reconnaissance.
        type: string
        required: true
      ref:
        description: >-
          Git ref to deploy - a tag, a branch or a SHA. Empty (the default)
          deploys the caller's own commit, which is what a merge or a tag push
          wants. A rollback passes the tag it is going back to, and that is the
          whole of a rollback: this workflow, aimed at an older commit.
        type: string
        required: false
        default: ''
      stage:
        description: 'Passed as --context stage=<value>, and used in the job name.'
        type: string
        required: false
        default: dev
      region:
        description: 'AWS region. Passed as --context region=<value> and to the credentials action.'
        type: string
        required: false
        default: us-east-1
      environment:
        description: >-
          GitHub environment to record the deployment against. Referencing one
          that does not exist creates it, so the default is safe for a consumer
          that has not configured environments.
        type: string
        required: false
        default: dev
      runner:
        description: 'Runner label. Defaults to ubuntu-latest, so a consumer opts in to self-hosted.'
        type: string
        required: false
        default: ubuntu-latest
      node_version:
        description: 'Node major version used to build and run the CDK app.'
        type: string
        required: false
        default: "20"
      working_directory:
        description: 'Directory holding the CDK app (cdk.json, package.json).'
        type: string
        required: false
        default: infrastructure
      docker_assets:
        description: >-
          Set true when the CDK app builds container image assets — it adds QEMU
          and Buildx for linux/amd64 and linux/arm64. Left false, a deploy with
          no image assets skips two steps it never needed.
        type: boolean
        required: false
        default: false
    secrets:
      DISCORD_RELEASE_WEBHOOK_URL:
        description: >-
          Discord webhook for the deploy notification. Optional: without it the
          notify step no-ops, so consumers can bump to this tag before the
          secret exists in their repository. Reaching it needs `secrets: inherit`
          on the call — a called workflow cannot read the caller's secrets
          otherwise, which is the one line every consumer has to add.
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.stage }} (${{ inputs.region }})
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    timeout-minutes: 30

    steps:
      # `ref: ''` is what actions/checkout already does by default, so the
      # empty default is genuinely today's behaviour and no consumer moves.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up QEMU
        if: inputs.docker_assets
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        if: inputs.docker_assets
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json

      - name: Install CDK dependencies
        working-directory: ${{ inputs.working_directory }}
        run: npm ci

      - name: Build CDK app
        working-directory: ${{ inputs.working_directory }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.role_to_assume }}
          aws-region: ${{ inputs.region }}

      - name: CDK Deploy
        working-directory: ${{ inputs.working_directory }}
        run: |
          npx cdk deploy --all --require-approval never \
            --context stage=${{ inputs.stage }} \
            --context region=${{ inputs.region }}

      - name: Deployment Summary
        env:
          ROLE_ARN: ${{ inputs.role_to_assume }}
        run: |
          {
            echo "### Deployment Successful"
            echo ""
            echo "- **Stage**: ${{ inputs.stage }}"
            echo "- **Region**: ${{ inputs.region }}"
            echo "- **Account**: $(printf '%s' "$ROLE_ARN" | cut -d: -f5)"
            echo "- **Ref**: ${{ inputs.ref || github.ref_name }}"
            # Read off the checkout, not from `github.sha`: a rollback runs from
            # a branch, so `github.sha` is that branch's head and not the commit
            # that just shipped.
            echo "- **Commit**: $(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Last, and `always()`: a failed deploy is the one worth having in the
      # channel. The action itself never fails the job.
      - name: Notify Discord
        if: always()
        uses: Answering-IT/github/notify-discord-deploy@v1.5.0
        with:
          webhook_url: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          stage: ${{ inputs.stage }}
          region: ${{ inputs.region }}
          details: ${{ inputs.ref && format('**Ref** `{0}`', inputs.ref) || '' }}
