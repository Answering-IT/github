name: Build & Gates (TypeScript - Reusable)

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner label for all three jobs. Defaults to ubuntu-latest, so existing
          callers are unaffected. Set it to self-hosted to run the gates on an
          Answering self-hosted runner.
        type: string
        required: false
        default: ubuntu-latest
      node_version:
        description: >-
          Node major version. Defaults to 24, which is what this workflow has always
          used. A consumer migrating from an older pin can pass its previous version to
          keep the move to this repository separate from a runtime upgrade.
        type: string
        required: false
        default: "24"

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  build:
    name: Build
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    name: Unit Tests
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
