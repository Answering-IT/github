name: Build & Gates (Go - Reusable)

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner label for every job. Defaults to ubuntu-latest, so existing callers
          are unaffected. Set it to self-hosted to run on the Answering runner.
        type: string
        required: false
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  build:
    name: Build
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build
        run: go build -v ./...

  test:
    name: Unit Tests
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run tests
        run: go test -v ./...
